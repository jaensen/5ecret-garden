name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: circles-app checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Svelte app
        working-directory: circles-app
        run: npm run check

      - name: Run unit tests
        working-directory: circles-app
        run: npm exec -- vitest run

      - name: Build Svelte app
        working-directory: circles-app
        run: npm run build

      - name: Optional flow contract guardrails
        working-directory: circles-app
        run: |
          if [ -f scripts/flow-contract-guardrails.mjs ]; then
            npm run check:flow-contracts
          else
            echo "Skipping check:flow-contracts because scripts/flow-contract-guardrails.mjs is missing."
          fi

      - name: Optional UI token guardrails
        working-directory: circles-app
        run: |
          if [ -f scripts/ui-token-guardrails.mjs ]; then
            npm run check:ui-tokens
            npm run check:ui-tokens:strict
          else
            echo "Skipping UI token guardrails because scripts/ui-token-guardrails.mjs is missing."
          fi

  packages:
    name: workspace package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build packages
        shell: bash
        run: |
          set -euo pipefail
          for package_json in packages/*/package.json; do
            dir="$(dirname "$package_json")"
            name="$(node -p "require('./$package_json').name")"
            echo "---------------------------------------------------"
            echo "Checking $name in $dir"

            if node -e "const p=require('./$package_json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then
              npm run typecheck --workspace "$name"
            else
              echo "No typecheck script for $name; skipping."
            fi

            if node -e "const p=require('./$package_json'); process.exit(p.scripts?.build ? 0 : 1)"; then
              npm run build --workspace "$name"
            else
              echo "No build script for $name; skipping."
            fi
          done
